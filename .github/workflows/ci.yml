name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Test · Build · Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Package store zip
        run: node scripts/zip.mjs

      - name: Upload store zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobinzy-store-zip
          path: release/jobinzy.zip
          if-no-files-found: error
