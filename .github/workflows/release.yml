name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build store zip and draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Package store zip
        run: node scripts/zip.mjs

      - name: Create GitHub Release with store zip
        uses: softprops/action-gh-release@v2
        with:
          files: release/jobinzy.zip
          generate_release_notes: true
